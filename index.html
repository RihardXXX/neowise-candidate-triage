<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="status" role="status"></p>
  <section id="result" hidden>
    <p><strong>Тема:</strong> <span id="topic"></span></p>
    <p><strong>Черновик ответа:</strong></p>
    <pre id="draft"></pre>
  </section>
  <script type="module">
    const TOPIC_LABELS = { delivery: "Доставка", pricing: "Цены", other: "Другое" };
    const form = document.querySelector("form");
    const statusEl = document.querySelector("#status");
    const resultEl = document.querySelector("#result");
    const topicEl = document.querySelector("#topic");
    const draftEl = document.querySelector("#draft");
    let lastRequestId = 0;

    function show(message, result = null) {
      statusEl.textContent = message;
      topicEl.textContent = result ? TOPIC_LABELS[result.topic] : "";
      draftEl.textContent = result ? result.draft : "";
      resultEl.hidden = result === null;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const requestId = ++lastRequestId;
      show("Разбираем заявку…");
      let body = null;
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: document.querySelector("#message").value }),
        });
        body = await reply.json();
      } catch {
        // Сеть или не-JSON: ниже покажем ручной разбор.
      }
      // Ответ на устаревший запрос не должен затереть результат нового.
      if (requestId !== lastRequestId) return;
      if (body?.status === "ready") {
        show("Проверьте черновик перед отправкой клиенту.", body);
      } else if (body?.status === "invalid_input") {
        show("Введите текст заявки.");
      } else {
        show("Не удалось разобрать заявку автоматически. Определите тему и подготовьте ответ вручную.");
      }
    });
  </script>
</body>
</html>
